<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- WCR Monogram Geometric Architecture -->
  <g transform="translate(64, 80)">
    <!-- Skyscraper / Office Silhouette Motif -->
    <path d="M70 300 L70 140 L140 90 L210 140 L210 300 Z" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M210 300 L210 70 L280 20 L350 70 L350 300 Z" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Central Collar / Tie Stylized V & W -->
    <path d="M120 180 L190 290 L260 180" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M190 290 L220 340 L250 290" fill="url(#gold)" />
    
    <!-- WCR Brand Typography -->
    <text x="190" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="6">WCR</text>
    <text x="190" y="405" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#f59e0b" letter-spacing="3">WHITE COLLAR REALTY</text>
  </g>
</svg>
